<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trip Clipper - Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Trip Clipper</h1>
    <p class="hint">Stored only in this browser (<code>chrome.storage.local</code>).</p>

    <label>
      Trip Planning app URL
      <input id="app-url" type="url" placeholder="https://trips.evancooperman.com" />
    </label>
    <p class="hint">Point this at your local dev server (e.g. <code>http://127.0.0.1:8060</code>) to test before deploying.</p>

    <button id="save-btn">Save</button>
    <p id="status" class="status"></p>

    <script src="options.js"></script>
  </body>
</html>
